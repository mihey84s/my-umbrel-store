version: "3.7"

services:
  app:
    image: lscr.io/linuxserver/steam:latest
    container_name: steam
    privileged: true
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=$TZ
      - LC_ALL=ru_RU.UTF-8
      - AUTO_GPU=true
      - SELKIES_ENCODER=x264enc
    volumes:
      - $APP_DATA_DIR/config:/config
    ports:
      # ВАЖНО: привязываем внешний порт Umbrel к внутреннему HTTP-порту 3000
      - $APP_PORT:3000
    shm_size: "2gb"
    restart: on-failure
