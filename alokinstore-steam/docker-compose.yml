version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: myrepo-steam_steam_1
      APP_PORT: 3000

  steam:
    image: lscr.io/linuxserver/steam:latest
    container_name: myrepo-steam_steam_1
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=$TZ
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    ports:
      - "3000:3000"
      - "3001:3001"
    shm_size: "1gb"
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
