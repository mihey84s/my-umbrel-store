version: "3.7"

services:
  app:
    image: lscr.io/linuxserver/steam:latest
    container_name: steam
    # Предоставляем контейнеру доступ к оборудованию хоста (включая /dev/dri для AMD)
    privileged: true
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=$TZ
      - LC_ALL=ru_RU.UTF-8
      - AUTO_GPU=true
      # Исправляем синтаксис кодека на чистый программный без лишних символов
      - SELKIES_ENCODER=x264enc
    volumes:
      - $APP_DATA_DIR/config:/config
    ports:
      - $APP_PORT:3001
    shm_size: "2gb"
    restart: on-failure
